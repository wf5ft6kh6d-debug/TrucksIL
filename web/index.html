<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b71c1c">
  <title>TrucksIL — prototype</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <header class="banner" role="alert" aria-live="polite">
    <strong data-i18n="banner.prototype"></strong>
    <span data-i18n="banner.coverage"></span>
  </header>
  <div class="layout">
    <aside class="panel">
      <div class="row lang">
        <label for="lang" data-i18n="lang.label"></label>
        <select id="lang">
          <option value="he">עברית</option>
          <option value="ar">العربية</option>
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </div>
      <div id="map-notice" class="msg warn" role="status" hidden></div>

      <section aria-labelledby="h-profile">
        <h2 id="h-profile" data-i18n="profile.heading"></h2>
        <label for="saved" data-i18n="profile.saved"></label>
        <select id="saved"></select>
        <form id="profile" novalidate>
          <label><span data-i18n="profile.name"></span><input name="profileName" maxlength="120" required></label>
          <div class="grid">
            <label><span data-i18n="profile.height"></span><input name="heightM" inputmode="decimal" dir="ltr" required></label>
            <label><span data-i18n="profile.width"></span><input name="widthM" inputmode="decimal" dir="ltr" required></label>
            <label><span data-i18n="profile.length"></span><input name="lengthM" inputmode="decimal" dir="ltr" required></label>
            <label><span data-i18n="profile.weight"></span><input name="grossWeightT" inputmode="decimal" dir="ltr" required></label>
            <label><span data-i18n="profile.axle"></span><input name="axleLoadT" inputmode="decimal" dir="ltr"></label>
          </div>
          <fieldset><legend data-i18n="profile.hazmat"></legend><div id="adr" class="adr"></div></fieldset>
          <label><span data-i18n="profile.note"></span><input name="note"></label>
          <div class="row">
            <button type="submit" data-i18n="profile.save"></button>
            <button type="button" id="del" class="secondary" data-i18n="profile.delete"></button>
          </div>
          <div id="profile-msg" class="msg" aria-live="polite"></div>
        </form>
      </section>

      <section aria-labelledby="h-route">
        <h2 id="h-route" data-i18n="route.heading"></h2>
        <form id="route" novalidate>
          <label><span data-i18n="route.from"></span>
            <span class="row"><input name="from" dir="ltr" placeholder="34.7818,32.0853"><button type="button" class="secondary" data-pick="from" data-i18n="route.pickFrom"></button></span></label>
          <label><span data-i18n="route.to"></span>
            <span class="row"><input name="to" dir="ltr" placeholder="35.2137,31.7683"><button type="button" class="secondary" data-pick="to" data-i18n="route.pickTo"></button></span></label>
          <button type="submit" data-i18n="route.submit"></button>
          <div id="route-msg" class="msg" aria-live="polite"></div>
        </form>
      </section>

      <section id="nav" aria-labelledby="h-nav">
        <h2 id="h-nav" data-i18n="nav.heading"></h2>
        <p class="caveat" data-i18n="nav.privacy"></p>
        <span class="row">
          <button type="button" id="nav-start" data-i18n="nav.start"></button>
          <button type="button" id="nav-sim" class="secondary" data-i18n="nav.simulate"></button>
          <button type="button" id="nav-stop" class="secondary" data-i18n="nav.stop" disabled></button>
        </span>
        <div class="grid">
          <label><span data-i18n="nav.speed"></span><input id="nav-speed" type="number" min="5" max="3000" value="60" dir="ltr"></label>
          <label><span data-i18n="nav.offset"></span><input id="nav-offset" type="number" min="0" max="2000" value="0" dir="ltr"></label>
        </div>
        <label class="chk"><input type="checkbox" id="nav-voice"> <span data-i18n="nav.voice"></span></label>
        <p class="caveat" data-i18n="nav.voiceNote"></p>
        <div id="voice-msg" class="msg" aria-live="polite"></div>
        <div id="nav-status" class="msg" aria-live="polite"></div>
      </section>

      <section id="shift" aria-labelledby="h-shift">
        <h2 id="h-shift" data-i18n="shift.heading"></h2>
        <p class="caveat" data-i18n="shift.disclaimer"></p>
        <p><strong id="shift-status" aria-live="polite"></strong></p>
        <span class="row">
          <button type="button" id="shift-start" data-i18n="shift.start"></button>
          <button type="button" id="shift-break" class="secondary" data-i18n="shift.break"></button>
          <button type="button" id="shift-resume" class="secondary" data-i18n="shift.resume"></button>
          <button type="button" id="shift-end" class="secondary" data-i18n="shift.end"></button>
        </span>
        <div id="shift-totals" class="msg"></div>
        <div id="shift-next" class="msg"></div>
        <div id="shift-alert" class="msg warn" role="alert" hidden></div>
        <details>
          <summary data-i18n="shift.settings"></summary>
          <form id="shift-settings" novalidate>
            <div class="grid">
              <label><span data-i18n="shift.limitShift"></span><input id="shift-limit" type="number" min="0.5" max="24" step="0.25" dir="ltr"></label>
              <label><span data-i18n="shift.limitDriving"></span><input id="shift-drive-limit" type="number" min="0.5" max="24" step="0.25" dir="ltr"></label>
              <label><span data-i18n="shift.limitBreak"></span><input id="shift-break-reminder" type="number" min="0" max="24" step="0.25" dir="ltr"></label>
            </div>
            <p class="caveat" data-i18n="shift.limitsNote"></p>
            <button type="submit" data-i18n="shift.save"></button>
            <div id="shift-settings-msg" class="msg good" aria-live="polite"></div>
          </form>
          <button type="button" id="shift-notify" class="secondary" data-i18n="shift.notify" hidden></button>
          <div id="shift-notify-msg" class="msg"></div>
        </details>
        <h3 data-i18n="shift.history"></h3>
        <p class="note" data-i18n="shift.privacy"></p>
        <div id="shift-history"></div>
        <span class="row">
          <button type="button" id="shift-export" class="secondary" data-i18n="shift.export"></button>
          <button type="button" id="shift-clear" class="secondary" data-i18n="shift.clear"></button>
        </span>
      </section>

      <section id="reports" aria-labelledby="h-reports">
        <h2 id="h-reports" data-i18n="reports.heading"></h2>
        <button type="button" class="secondary" id="report-add" data-i18n="reports.add"></button>
        <form id="report-form" novalidate hidden>
          <label><span data-i18n="reports.type"></span><select name="type" id="report-type"></select></label>
          <label><span data-i18n="reports.note"></span><textarea name="note" maxlength="280" rows="2"></textarea></label>
          <span class="row"><button type="submit" data-i18n="reports.send"></button><button type="button" class="secondary" id="report-cancel" data-i18n="reports.cancel"></button></span>
        </form>
        <div id="report-msg" class="msg" aria-live="polite"></div>
        <p class="caveat" data-i18n="reports.caveat"></p>
        <div id="reports-body"></div>
      </section>

      <section id="restr" aria-labelledby="h-restr" aria-live="polite">
        <h2 id="h-restr" data-i18n="restr.heading"></h2>
        <div id="restr-body"></div>
      </section>
    </aside>
    <main id="map" aria-label="map"></main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
