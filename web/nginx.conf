# TrucksIL web client: static app shell + same-origin reverse proxy to the API (no CORS needed).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # /api/v1/route -> http://api:8080/v1/route. Responses are never cached (safety data).
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
  }

  # Offline map (ADR-0015): data/tiles mounted read-only at /srv/tiles (docker-compose.yml).
  # nginx answers Range requests for static files natively (206); no SPA fallback here, so a
  # missing israel.pmtiles is a 404 and the app falls back to OSM raster tiles. no-cache = the
  # browser revalidates by ETag; the service worker keeps its own LRU copy for offline use.
  location /tiles/ {
    alias /srv/tiles/;
    types { application/octet-stream pmtiles; application/x-protobuf pbf; }
    add_header Cache-Control "no-cache";
    gzip off;
  }

  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /sw-policy.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location = /manifest.webmanifest { default_type application/manifest+json; }

  location / { try_files $uri /index.html; }
}
