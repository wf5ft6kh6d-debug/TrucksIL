name: Stage 3 one-time OSM pilot acquisition
on:
  push:
    branches: [stage3/israel-road-data-foundation]
    paths: [scripts/stage3/acquire_osm.py, scripts/stage3/acquire_members.py, scripts/stage3/acquire_review.py, .github/workflows/stage3-acquire.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
      - name: One bounded request, no retries
        run: |
          if test -f data/stage3/osm-haifa-20261010/raw.json.gz; then
            echo 'Frozen pilot already exists; no external request or refresh.'
          else
            python scripts/stage3/acquire_osm.py --output acquisition
          fi
      - if: ${{ hashFiles('acquisition/manifest.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: osm-pilot-raw
          path: acquisition/
          retention-days: 90
          if-no-files-found: error
      - name: Fetch only five historical dependencies if not frozen
        run: |
          if test -f data/stage3/osm-members-20261010/raw.json.gz; then
            echo 'Frozen dependencies exist; no request.'
          else
            python scripts/stage3/acquire_members.py --output acquisition-members
          fi
      - if: ${{ hashFiles('acquisition-members/manifest.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: osm-members-raw
          path: acquisition-members/
          retention-days: 90
          if-no-files-found: error
      - name: Current versions of four reviewed relations only
        run: |
          if test -f data/stage3/osm-review-20261010/raw.json.gz; then
            echo 'Review snapshot exists; no refresh.'
          else
            python scripts/stage3/acquire_review.py --output acquisition-review
          fi
      - if: ${{ hashFiles('acquisition-review/manifest.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: osm-review-raw
          path: acquisition-review/
          retention-days: 90
          if-no-files-found: error
