name: Stage 3 one-time OSM pilot acquisition
on:
  push:
    branches: [stage3/israel-road-data-foundation]
    paths: [scripts/stage3/acquire_osm.py, .github/workflows/stage3-acquire.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
      - name: One bounded request, no retries
        run: python scripts/stage3/acquire_osm.py --output acquisition
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: osm-pilot-raw
          path: acquisition/
          retention-days: 90
          if-no-files-found: error
