name: Stage 7 national evidence registry acceptance
on:
  push:
    branches: [stage7/israel-restriction-evidence-20261012]
permissions:
  contents: read
concurrency:
  group: stage7-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  national:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
      - name: Pinned research dependencies
        run: |
          python -m pip install pip==24.3.1
          python -m pip install osmium==4.0.2 networkx==3.4.2 shapely==2.0.6 numpy==2.1.3 pyproj==3.7.0 jsonschema==4.23.0 requests==2.32.3 urllib3==2.2.3 idna==3.10 charset-normalizer==3.4.0 certifi==2024.8.30 attrs==24.2.0 jsonschema-specifications==2024.10.1 referencing==0.35.1 rpds-py==0.20.0 typing_extensions==4.12.2 rfc3339-validator==0.1.4 six==1.16.0
          mkdir -p evidence
          python -m pip freeze > evidence/packages.txt
          git rev-parse HEAD > evidence/commit.txt
      - name: Existing and national unit tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee evidence/unit.log
          python scripts/compare_schema_engine.py | tee evidence/schema.log
          python scripts/stage6/contract.py | tee evidence/stage6-schema.log
      - name: Integrate attributed public evidence and exact replay
        run: |
          set -euo pipefail
          python scripts/stage7/run_research.py data/stage7 stage7-output --repeat | tee evidence/stage7-research.log
      - name: Isolated PostGIS constraints full rows repeat audit and rollback
        run: |
          set -euo pipefail
          docker pull postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
          docker run -d --name stage7-postgis --network none -e POSTGRES_PASSWORD=disposable_ci_only postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
          for n in $(seq 1 60); do
            if test "$(docker exec stage7-postgis cat /proc/1/comm)" = postgres && docker exec --user postgres stage7-postgis pg_isready -h /var/run/postgresql; then break; fi
            sleep 1
          done
          docker exec --user postgres stage7-postgis createdb -h /var/run/postgresql trucksil_stage7_test_evidence
          docker exec -i --user postgres stage7-postgis psql -X -h /var/run/postgresql -d trucksil_stage7_test_evidence -v ON_ERROR_STOP=1 < stage7-output/stage7-postgis.sql 2>&1 | tee evidence/stage7-postgis.log
          grep -F STAGE7_POSTGIS_PASS evidence/stage7-postgis.log
          git fsck --full
      - name: Preserve public evidence outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage7-evidence-${{ github.run_id }}
          path: |
            evidence/
            stage7-output/
          retention-days: 90
          if-no-files-found: error
      - name: Destroy disposable database
        if: always()
        run: docker rm -fv stage7-postgis || true
