name: Stage 3 bounded OSM relation history
on:
  push:
    branches: [stage3/israel-road-data-foundation]
    paths: [.github/workflows/stage3-history.yml]
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
      - name: Four public histories once; no graph refresh or retries
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,urllib.request,datetime,xml.etree.ElementTree as ET
          if pathlib.Path('data/stage3/osm-history-20261010/manifest.json').exists():
              print('Frozen histories exist; no download.');raise SystemExit(0)
          p=pathlib.Path('history');p.mkdir();entries=[]
          for ident in (12303230,13395546,10115408,10115411):
              url=f'https://api.openstreetmap.org/api/0.6/relation/{ident}/history'
              entry={'id':ident,'url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'TrucksIL-Research/0.1 (https://github.com/wf5ft6kh6d-debug/TrucksIL)','Accept-Encoding':'identity'})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      if r.status!=200 or r.url!=url:raise ValueError('Unexpected response/redirect')
                      raw=r.read(1048577)
                  if len(raw)>1048576:raise ValueError('Response too large')
                  root=ET.fromstring(raw)
                  if root.tag!='osm' or not root.findall('relation') or any(int(e.attrib['id'])!=ident for e in root.findall('relation')):raise ValueError('Unexpected history')
                  name=f'relation-{ident}.xml';(p/name).write_bytes(raw)
                  entry.update(file=name,sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),status='received')
              except Exception as e:entry.update(status='blocked',error=str(e))
              entries.append(entry)
          (p/'manifest.json').write_text(json.dumps({'scope':'four relation histories only; no graph import','license':'ODbL-1.0','license_evidence':'https://www.openstreetmap.org/copyright','attribution':'© OpenStreetMap contributors','entries':entries},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(entries))
          PY
      - if: ${{ hashFiles('history/manifest.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: osm-history-evidence
          path: history/
          retention-days: 90
          if-no-files-found: error
